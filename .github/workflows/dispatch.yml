name: dispatch

on:
  schedule:
    - cron: "17 20 * * 0,2,4" # Mon/Wed/Fri 05:17 KST (off the top of the hour to dodge cron congestion). The schedule is also quoted in BRAND.description and ui.emptyNote (lib/i18n.ts) and in config/prompt.ts.
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["desk-pet/**", "docs/**"]

permissions: {}

concurrency:
  group: dispatch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the snapshot commit
      pages: read # configure-pages reads the site URL / base path
    env:
      # Without a Claude credential (subscription token or API key), skip collection instead of publishing an uncurated edition.
      # (Only a boolean is computed here; the secret values themselves are exposed to the collect step alone.)
      COLLECT: ${{ github.event_name != 'push' && (secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Decide whether to collect
        id: plan
        if: env.COLLECT == 'true'
        run: |
          # A delayed or duplicate scheduled run must not spend tokens on an edition that already exists.
          TODAY=$(TZ=Asia/Seoul date +%F)
          if [ "${{ github.event_name }}" = schedule ] && [ -f "data/snapshots/$TODAY.json" ]; then
            echo "edition $TODAY already published"
          else
            echo "collect=true" >> "$GITHUB_OUTPUT"
          fi

      # Install in its own step with no secrets in the environment. Scripts must stay on:
      # the postinstall copies the platform binary over the bin/claude.exe stub.
      - name: Install Claude CLI
        if: steps.plan.outputs.collect == 'true'
        run: npm i -g @anthropic-ai/claude-code@2.1.296

      - name: Collect edition
        if: steps.plan.outputs.collect == 'true'
        env:
          # Either one works. If both are set the CLI prefers ANTHROPIC_API_KEY (pay-as-you-go) over the OAuth token.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # An unset secret arrives as an empty string; drop it so it cannot shadow the other credential.
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          npm run collect

      - name: Commit snapshot
        if: steps.plan.outputs.collect == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          git diff --cached --quiet || { git commit -m "edition: $(TZ=Asia/Seoul date +%F)"; git push; }

      - run: npm test
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm run build
        env:
          # Derived from the repo's Pages settings, so a fork builds for its own path.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
