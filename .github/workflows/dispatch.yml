name: dispatch

on:
  schedule:
    - cron: "17 20 * * 0,2,4" # Mon/Wed/Fri 05:17 KST (off the top of the hour to dodge cron congestion)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/snapshots/**", "desk-pet/**", "docs/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dispatch
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Without the subscription token, skip collection instead of publishing an uncurated edition.
      COLLECT: ${{ github.event_name != 'push' && secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Collect edition
        if: env.COLLECT == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm i -g @anthropic-ai/claude-code
          npm run collect

      - name: Commit snapshot
        if: env.COLLECT == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          git diff --cached --quiet || { git commit -m "edition: $(TZ=Asia/Seoul date +%F)"; git push; }

      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /ai-trend
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v5
