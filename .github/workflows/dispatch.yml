name: dispatch

on:
  schedule:
    - cron: "17 20 * * 0,2,4" # Mon/Wed/Fri 05:17 KST (off the top of the hour to dodge cron congestion)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/snapshots/**", "desk-pet/**", "docs/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dispatch
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Without the subscription token, skip collection instead of publishing an uncurated edition.
      COLLECT: ${{ github.event_name != 'push' && secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Collect edition
        if: env.COLLECT == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A delayed or duplicate scheduled run must not spend tokens on an edition that already exists.
          TODAY=$(TZ=Asia/Seoul date +%F)
          if [ "${{ github.event_name }}" = schedule ] && [ -f "data/snapshots/$TODAY.json" ]; then echo "edition $TODAY already published"; exit 0; fi
          npm i -g @anthropic-ai/claude-code@2.1.296
          npm run collect

      - name: Commit snapshot
        if: env.COLLECT == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          git diff --cached --quiet || { git commit -m "edition: $(TZ=Asia/Seoul date +%F)"; git push; }

      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /ai-trend
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
